events {}

http {
  server {
    listen 80;

    # Basic auth (pour toi)
    auth_basic "Ditto-NEW";
    auth_basic_user_file /etc/nginx/ditto.htpasswd;

    location = /health {
      auth_basic off;
      proxy_pass http://ditto-gateway:8080/health;
    }

    location /ui/ {
      auth_basic "Ditto";
      auth_basic_user_file /etc/nginx/ditto.htpasswd;

      proxy_pass http://ditto-ui:8080/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }

    # Proxy vers Ditto Gateway
    location / {
      proxy_pass http://ditto-gateway:8080;

      # IMPORTANT: ne pas forwarder Authorization (BasicAuth) au gateway
      proxy_set_header Authorization "";

      # Headers
      proxy_set_header Host ditto-gateway;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # WebSocket
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";

      # Pré-auth Ditto
      proxy_set_header x-ditto-pre-authenticated "nginx:$remote_user";
    }
  }
}
